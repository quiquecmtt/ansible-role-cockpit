---
- name: Prepare optional Debian backports support
  become: true
  ansible.builtin.apt:
    name:
      - python3-debian
      - debian-archive-keyring
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: cockpit_debian_backports

- name: Configure backports only when explicitly requested on Debian
  become: true
  ansible.builtin.deb822_repository:
    name: cockpit-backports
    types: [deb]
    uris: https://deb.debian.org/debian
    suites: "{{ ansible_facts['distribution_release'] }}-backports"
    components: [main]
    signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
    enabled: true
  when: cockpit_debian_backports
  register: cockpit_backports_repo

- name: Install Cockpit and selected optional components
  become: true
  ansible.builtin.apt:
    name: "{{ cockpit_packages + cockpit_plugins + (cockpit_metrics_packages if cockpit_metrics_enabled else []) }}"
    state: "{{ cockpit_pkg_state }}"
    default_release: "{{ (ansible_facts['distribution_release'] ~ '-backports') if cockpit_debian_backports else omit }}"
    update_cache: true
    cache_valid_time: "{{ 0 if cockpit_backports_repo is changed else 3600 }}"
    policy_rc_d: 101
