---
- name: Create the configuration and socket drop-in directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ cockpit_config_dir }}"
    - /etc/systemd/system/cockpit.socket.d

- name: Provision Cockpit disallowed-users from template.
  become: true
  tags:
    - cockpit
    - cockpit_configuration
  ansible.builtin.template:
    src: disallowed-users.j2
    dest: "{{ cockpit_config_dir }}/disallowed-users"
    mode: "0644"
    owner: root
    group: root

- name: Provision Cockpit configuration from template.
  become: true
  tags:
    - cockpit
    - cockpit_configuration
  ansible.builtin.template:
    src: cockpit.conf.j2
    dest: "{{ cockpit_config_dir }}/cockpit.conf"
    mode: "0644"
    owner: root
    group: root
  notify: Reload Cockpit configuration on next activation

- name: Configure the explicit socket listeners
  become: true
  ansible.builtin.template:
    src: cockpit.socket.conf.j2
    dest: /etc/systemd/system/cockpit.socket.d/50-ansible-listen.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reconfigure Cockpit listener
