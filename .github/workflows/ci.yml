---
name: Continuous Integration
"on":
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 7 * * 0"
  workflow_dispatch:

defaults:
  run:
    working-directory: "quiquecmtt.cockpit"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: "quiquecmtt.cockpit"

      - name: Set up Python 3.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install test dependencies.
        run: python -m pip install -r requirements-dev.txt

      - name: Install pinned Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Lint code.
        run: |
          ansible-lint
          python -m unittest discover -s tests -v

  molecule:
    name: Molecule (${{ matrix.distro }}, ${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [default]
        distro:
          - fedora44
          - rockylinux9
          - debian12
          - debian13
          - ubuntu2404
          - ubuntu2204
        include:
          - distro: fedora44
            variant: metrics
            metrics: "true"
          - distro: debian13
            variant: backports
            backports: "true"
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: "quiquecmtt.cockpit"

      - name: Telemetry
        uses: quiquecmtt/telemetry-action@v1
        with:
          sampling_interval: "2"
          output_format: "both"
          artifact_name: "resource-metrics-molecule-${{ matrix.distro }}-${{ matrix.variant }}"

      - name: Set up Python 3.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install test dependencies.
        run: python -m pip install -r requirements-dev.txt

      - name: Run Molecule tests.
        run: molecule test
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          MOLECULE_DISTRO: ${{ matrix.distro }}
          MOLECULE_METRICS: ${{ matrix.metrics || 'false' }}
          MOLECULE_BACKPORTS: ${{ matrix.backports || 'false' }}
